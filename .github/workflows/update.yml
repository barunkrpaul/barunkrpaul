name: Update profile card

on:
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab
  push:
    paths: ["config.json", "generate.py", "ascii_*.txt"]
  schedule:
    - cron: "0 0 * * *"       # every day at 00:00 UTC, to refresh uptime and stats

permissions:
  contents: write             # lets the job commit the new SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 generate.py
        env:
          # Add a PROFILE_TOKEN secret if you want private repos counted too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the new cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Update profile card"
          git push
